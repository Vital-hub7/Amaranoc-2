<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amaranoc</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <script src="https://kit.fontawesome.com/yourcode.js" crossorigin="anonymous"></script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
  <header>
    <div class="head">
      <a class="logo" href="#"><img src="https://amaranoc.am/images/logo.svg" alt=""></a>
      <div class="bajinner">
        <a class="glxavor" href="">Գլխավոր</a>
        <a class="zexcher" href="">Զեղչեր</a>
        <a class="carayutyunner" href="">Ծառայություններ</a>
        <a class="info" href="">Մեր մասին</a>
      </div>
      <div class="search">
        <i class="fa fa-globe"></i>
        <i class="fa fa-user-circle-o"></i>
        <input type="text" placeholder="Որոնում">
      </div>
  </header>

  <section class="mas1">
    <h2>Տարածաշրջան</h2>
    <br>
    <div class="regions">
      <label class="region">
        <input type="checkbox">
        <span>Դիլիջան</span>
        <span class="count">179</span>
      </label>

      <label class="region">
        <input type="checkbox">
        <span>Ծաղկաձոր</span>
        <span class="count">103</span>
      </label>

      <label class="region">
        <input type="checkbox">
        <span>Աշտարակ</span>
        <span class="count">38</span>
      </label>

      <label class="region">
        <input type="checkbox">
        <span>Գառնի</span>
        <span class="count">35</span>
      </label>

      <label class="region">
        <input type="checkbox">
        <span>Ջերմուկ</span>
        <span class="count">27</span>
      </label>
    </div>

    <div class="price">
      <span>Արժեք</span>
      <button class="activ">֏</button>
      <button>$</button>
      <button>€</button>
      <button>₽</button>
    </div>

    <div class="price2">
      <div class="price-inputs">
        <input type="number" placeholder="Սկսած">
        <span>-</span>
        <input type="number" placeholder="Մինչև">
      </div>
    </div>

    <div class="count-section">
      <h5>Մարդկանց թույլատրելի քանակ</h5>

      <div class="qanak">
        <button class="minus">−</button>
        <input type="number" min="0" placeholder="1">
        <button class="plus">+</button>
      </div>
    </div>
  </section>
</body>

</html>
